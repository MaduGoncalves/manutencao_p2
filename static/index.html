<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Placar Eletrônico</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="painel-principal">
  <!-- Display do Cronômetro -->
  <div id="display-cronometro">--:--</div>

  <!-- Container dos Times -->
  <div id="container-times">
    <!-- Time A -->
    <div class="cartao-time">
      <h2>TIME A</h2>
      <div class="display-pontos" id="pontos-time-a">0</div>
      
      <div class="grupo-botoes">
        <button class="btn-acao" data-tipo="pontos" data-time="0" data-valor="1">+1</button>
        <button class="btn-acao" data-tipo="pontos" data-time="0" data-valor="2">+2</button>
        <button class="btn-acao" data-tipo="pontos" data-time="0" data-valor="3">+3</button>
        <button class="btn-acao botao-remover" data-tipo="pontos" data-time="0" data-valor="-1">-1</button>
      </div>

      <div class="display-faltas">Faltas: <b id="faltas-time-a">0</b></div>
      
      <div class="grupo-botoes">
        <button class="btn-acao" data-tipo="faltas" data-time="0" data-valor="1">+ Falta</button>
        <button class="btn-acao botao-remover" data-tipo="faltas" data-time="0" data-valor="-1">- Falta</button>
      </div>
    </div>

    <!-- Time B -->
    <div class="cartao-time">
      <h2>TIME B</h2>
      <div class="display-pontos" id="pontos-time-b">0</div>
      
      <div class="grupo-botoes">
        <button class="btn-acao" data-tipo="pontos" data-time="1" data-valor="1">+1</button>
        <button class="btn-acao" data-tipo="pontos" data-time="1" data-valor="2">+2</button>
        <button class="btn-acao" data-tipo="pontos" data-time="1" data-valor="3">+3</button>
        <button class="btn-acao botao-remover" data-tipo="pontos" data-time="1" data-valor="-1">-1</button>
      </div>

      <div class="display-faltas">Faltas: <b id="faltas-time-b">0</b></div>
      
      <div class="grupo-botoes">
        <button class="btn-acao" data-tipo="faltas" data-time="1" data-valor="1">+ Falta</button>
        <button class="btn-acao botao-remover" data-tipo="faltas" data-time="1" data-valor="-1">- Falta</button>
      </div>
    </div>
  </div>

  <!-- Controles da Partida -->
  <div id="painel-controles">
    <button id="btn-iniciar" class="botao-iniciar">Iniciar</button>
    <button id="btn-pausar">Pausar</button>

    <input id="campo-minutos" type="number" min="0" value="10" title="minutos">
    <button id="btn-definir-tempo">Definir min</button>

    <button id="btn-reiniciar" class="botao-remover">Reiniciar</button>
  </div>
</div>

<script src="/script.js"></script>
</body>
</html>
