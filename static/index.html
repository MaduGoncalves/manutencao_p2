<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Placar Eletrônico</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="painel-principal">
  <!-- Display do Cronômetro -->
  <div id="display-cronometro">10:00</div>

  <!-- Container dos Times -->
  <div id="container-times">
    <!-- Time A -->
    <div class="cartao-time">
      <h2>TIME A</h2>
      <div class="display-pontos" id="pontos-time-a">0</div>
      
      <div class="grupo-botoes">
        <button onclick="enviarComando('/pontos/0/1')">+1</button>
        <button onclick="enviarComando('/pontos/0/2')">+2</button>
        <button onclick="enviarComando('/pontos/0/3')">+3</button>
        <button class="botao-remover" onclick="enviarComando('/pontos/0/-1')">-1</button>
      </div>

      <div class="display-faltas">Faltas: <b id="faltas-time-a">0</b></div>
      
      <div class="grupo-botoes">
        <button onclick="enviarComando('/faltas/0/1')">+ Falta</button>
        <button class="botao-remover" onclick="enviarComando('/faltas/0/-1')">- Falta</button>
      </div>
    </div>

    <!-- Time B -->
    <div class="cartao-time">
      <h2>TIME B</h2>
      <div class="display-pontos" id="pontos-time-b">0</div>
      
      <div class="grupo-botoes">
        <button onclick="enviarComando('/pontos/1/1')">+1</button>
        <button onclick="enviarComando('/pontos/1/2')">+2</button>
        <button onclick="enviarComando('/pontos/1/3')">+3</button>
        <button class="botao-remover" onclick="enviarComando('/pontos/1/-1')">-1</button>
      </div>

      <div class="display-faltas">Faltas: <b id="faltas-time-b">0</b></div>
      
      <div class="grupo-botoes">
        <button onclick="enviarComando('/faltas/1/1')">+ Falta</button>
        <button class="botao-remover" onclick="enviarComando('/faltas/1/-1')">- Falta</button>
      </div>
    </div>
  </div>

  <!-- Controles da Partida -->
  <div id="painel-controles">
    <button class="botao-iniciar" onclick="enviarComando('/iniciar')">Iniciar</button>
    <button onclick="enviarComando('/pausar')">Pausar</button>

    <input id="campo-minutos" type="number" min="0" value="10" title="minutos">
    <button onclick="definirTempoPartida()">Definir min</button>

    <button class="botao-remover" onclick="if(confirm('Reiniciar partida?')) enviarComando('/reiniciar')">Reiniciar</button>
  </div>
</div>

<script src="/script.js"></script>
</body>
</html>
